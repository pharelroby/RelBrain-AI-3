<!DOCTYPE html>
<html lang="fr">
<head>
<script>(function(){try{var p=localStorage.getItem('rb-theme')||'light';if(p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');}catch(e){}})();</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>RelBrain – Maintenance</title>
<link rel="icon" href="icon.svg"/>
<script src="relbrain-config.js"></script>
<style>
:root{--bg:#fdf4e8;--card:#fff;--line:#e7d9c5;--ink:#2a1d44;--muted:#78716c}
:root.dark{--bg:#14101f;--card:#1c1730;--line:rgba(255,255,255,.1);--ink:#ede9fe;--muted:#a1a1aa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.25rem;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:100%;max-width:27rem;background:var(--card);border:1px solid var(--line);border-radius:1.5rem;padding:2.25rem 1.75rem;text-align:center;box-shadow:0 20px 50px rgba(124,58,237,.1)}
svg{width:92px;height:92px;overflow:visible;margin-bottom:.75rem}
.n{fill:#7c3aed;transform-box:fill-box;transform-origin:center;animation:p 2.2s ease-in-out infinite}.b{fill:#a855f7;animation-delay:.35s}.c{fill:#ec4899;animation-delay:.7s}.d{fill:#f59e0b;animation-delay:1.05s}
.l{stroke:#c4b5fd;stroke-width:3;stroke-linecap:round;fill:none}
@keyframes p{0%,100%{transform:scale(.8)}50%{transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){.n{animation:none}}
h1{font-size:1.45rem;margin:0 0 .5rem;letter-spacing:-.02em}
p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.6;font-weight:500}
#eta{margin-top:.9rem;font-weight:800;color:#7c3aed;font-size:.85rem}
.status{display:inline-flex;align-items:center;gap:.45rem;margin-top:1.25rem;font-size:.75rem;font-weight:700;color:var(--muted)}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:#f59e0b;animation:p 1.4s infinite}
button{margin-top:1.25rem;width:100%;padding:.8rem;border:0;border-radius:.8rem;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c3aed,#a855f7 60%,#ec4899);cursor:pointer}
a{display:inline-block;margin-top:1rem;font-size:.72rem;color:var(--muted);font-weight:600}
</style>
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-title" content="RelBrain"/>
<meta name="theme-color" content="#7c3aed"/>
<script src="/relbrain-i18n.js?v=9733f5f28b"></script>
</head>
<body>
<main>
  <svg viewBox="0 0 80 80" aria-hidden="true"><path class="l" d="M16 24 40 14 64 28 54 58 24 60 16 24 M40 14 40 38 M64 28 40 38 M24 60 40 38"/><circle class="n" cx="16" cy="24" r="7"/><circle class="n b" cx="40" cy="14" r="7"/><circle class="n c" cx="64" cy="28" r="7"/><circle class="n d" cx="54" cy="58" r="7"/><circle class="n b" cx="24" cy="60" r="7"/><circle class="n" cx="40" cy="38" r="9"/></svg>
  <h1 id="title">On révise le site</h1>
  <p id="msg">RelBrain est en maintenance pour quelques instants. Tes cours, ton XP et ta série sont en sécurité.</p>
  <p id="eta" hidden></p>
  <div class="status"><span class="dot"></span> <span id="state">On revient dès que c'est prêt, cette page se recharge seule.</span></div>
  <button type="button" id="retry">Réessayer maintenant</button>
  <a href="relbrain-login.html?next=relbrain-admin.html" id="admin">Accès administrateur</a>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), reason = q.get('reason'), c = window.RB_CONFIG || {};
  var from = q.get('from') || '';
  var back = /^[a-z0-9\-]+\.html(\?[^#]*)?$/i.test(from) ? from : 'index.html';
  var $ = function (id) { return document.getElementById(id); };
  var TEXT = {
    down: ['Petit souci technique', 'Nos serveurs ne répondent pas pour le moment. Tes cours, ton XP et ta série sont en sécurité.'],
    offline: ['Pas de connexion', 'Vérifie ton Wi-Fi ou tes données mobiles. RelBrain reprend dès que le réseau revient.'],
  };
  if (TEXT[reason]) { $('title').textContent = TEXT[reason][0]; $('msg').textContent = TEXT[reason][1]; $('admin').hidden = reason === 'offline'; }

  function leave() { try { sessionStorage.removeItem('rb-gate'); } catch (e) {} location.replace(back); }
  function poll() {
    if (!c.SUPABASE_URL) return leave();
    fetch(c.SUPABASE_URL + '/rest/v1/app_settings?id=eq.1&select=maintenance,message,eta', { headers: { apikey: c.SUPABASE_ANON_KEY }, cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (rows) {
        var s = rows[0] || {};
        if (!s.maintenance) return leave();
        if (s.message) $('msg').textContent = s.message;
        if (s.eta) { $('eta').hidden = false; $('eta').textContent = 'Retour prévu : ' + new Date(s.eta).toLocaleString('fr-FR', { weekday: 'long', hour: '2-digit', minute: '2-digit' }); }
      })
      .catch(function () {});
  }
  $('retry').onclick = function () { navigator.onLine === false ? location.reload() : poll(); };
  poll();
  setInterval(poll, 20000);
  window.addEventListener('online', poll);
})();
</script>
</body>
</html>
