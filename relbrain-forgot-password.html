<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RelBrain.AI – Mot de passe oublié</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box;}
body{background:#fdf4e8;min-height:100vh;color:#0f172a;}
.hero-bg{background:radial-gradient(ellipse 55% 45% at 15% 5%,rgba(251,191,36,.10),transparent 55%),radial-gradient(ellipse 50% 45% at 85% 15%,rgba(236,72,153,.10),transparent 55%),#fdf4e8;}
.gradient-text{background:linear-gradient(135deg,#7c3aed,#a855f7 40%,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.gradient-bg{background:linear-gradient(135deg,#7c3aed,#a855f7 60%,#ec4899);}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.float{animation:float 3s ease-in-out infinite;}
.rb-input{width:100%;padding:.85rem 1rem;border:1.5px solid #e7d9c5;border-radius:.875rem;font-size:.875rem;color:#0f172a;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;}
.rb-input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.12);}
.rb-input::placeholder{color:#a8a29e;}
.rb-label{display:block;font-size:.75rem;font-weight:800;color:#57534e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;}
.input-wrap{position:relative;}
.input-wrap .input-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:#a8a29e;font-size:.8rem;pointer-events:none;}
.input-wrap .rb-input.has-icon{padding-left:2.4rem;}
.step-panel{display:none;}
.step-panel.active{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body class="hero-bg">

<nav class="fixed top-0 left-0 right-0 z-50 bg-[#fdf4e8]/85 backdrop-blur-sm border-b border-[#e7d9c5]">
  <div class="max-w-6xl mx-auto px-5 h-14 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2">
      <div class="bg-violet-600 text-white p-1.5 rounded-xl shadow-md shadow-violet-200"><i class="fa-solid fa-brain text-base"></i></div>
      <span class="text-base font-black text-slate-900">RelBrain<span class="text-violet-600">.ai</span></span>
    </a>
    <a href="relbrain-login.html" class="text-xs font-bold text-slate-600 hover:text-violet-600 flex items-center gap-1.5">
      <i class="fa-solid fa-arrow-left text-[10px]"></i> Connexion
    </a>
  </div>
</nav>

<main class="min-h-screen flex items-center justify-center px-4 pt-14 pb-10">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-xl border border-[#e7d9c5] overflow-hidden">
      <div class="p-7 md:p-9">

        <!-- ÉTAPE 1 -->
        <div class="step-panel active" id="step-1">
          <div class="text-center mb-7">
            <div class="w-16 h-16 bg-violet-50 border border-violet-100 rounded-2xl flex items-center justify-center mx-auto mb-4 float">
              <i class="fa-solid fa-key text-violet-500 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 mb-1">Mot de passe oublié ?</h1>
            <p class="text-sm text-slate-500 font-semibold">Entre ton email, on t'enverra un lien de réinitialisation.</p>
          </div>

          <div class="mb-5">
            <label class="rb-label" for="email">Adresse email</label>
            <div class="input-wrap">
              <i class="fa-solid fa-envelope input-icon"></i>
              <input type="email" id="email" class="rb-input has-icon" placeholder="toi@exemple.com"/>
            </div>
          </div>

          <button class="w-full gradient-bg text-white font-black py-3.5 rounded-xl shadow-lg shadow-violet-200 text-sm flex items-center justify-center gap-2 hover:-translate-y-0.5 transition-all" onclick="sendReset()">
            <i class="fa-solid fa-paper-plane"></i> Envoyer le lien
          </button>

          <p class="text-center text-xs text-slate-500 mt-5 font-semibold">
            Tu te souviens ? <a href="relbrain-login.html" class="text-violet-600 font-black hover:underline">Se connecter</a>
          </p>
        </div>

        <!-- ÉTAPE 2 : envoyé -->
        <div class="step-panel" id="step-2">
          <div class="text-center">
            <div class="w-20 h-20 bg-gradient-to-br from-emerald-500 to-teal-500 rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-xl shadow-emerald-200">
              <i class="fa-solid fa-paper-plane text-white text-3xl"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 mb-2">Email envoyé !</h2>
            <p class="text-sm text-slate-500 mb-1 font-semibold">Un lien de réinitialisation a été envoyé à</p>
            <p class="text-sm font-black text-violet-600 mb-7" id="target-email">—</p>

            <div class="bg-[#fdf4e8] border border-[#e7d9c5] rounded-2xl p-4 text-left mb-6">
              <p class="text-xs text-slate-500 leading-relaxed font-semibold"><i class="fa-solid fa-clock text-violet-400 mr-1"></i> Le lien expire dans 15 minutes. Vérifie tes spams si tu ne le vois pas.</p>
            </div>

            <button class="w-full border-2 border-[#e7d9c5] hover:border-violet-300 text-slate-600 font-bold py-3 rounded-xl text-sm" onclick="location.href='relbrain-reset-password.html'">
              Simuler le clic sur le lien →
            </button>

            <p class="text-center text-xs text-slate-500 mt-5 font-semibold">
              <a href="relbrain-login.html" class="text-violet-600 font-black hover:underline">← Retour à la connexion</a>
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<script>
function sendReset(){
  const email = document.getElementById('email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    document.getElementById('email').style.borderColor = '#f43f5e';
    return;
  }
  document.getElementById('target-email').textContent = email;
  document.getElementById('step-1').classList.remove('active');
  document.getElementById('step-2').classList.add('active');
}
</script>
</body>
</html>
