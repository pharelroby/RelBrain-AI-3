<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RelBrain.AI – Nouveau mot de passe</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{font-family:'Inter',sans-serif;box-sizing:border-box;}
body{background:#fdf4e8;min-height:100vh;color:#0f172a;}
.hero-bg{background:radial-gradient(ellipse 55% 45% at 15% 5%,rgba(251,191,36,.10),transparent 55%),radial-gradient(ellipse 50% 45% at 85% 15%,rgba(236,72,153,.10),transparent 55%),#fdf4e8;}
.gradient-bg{background:linear-gradient(135deg,#7c3aed,#a855f7 60%,#ec4899);}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.float{animation:float 3s ease-in-out infinite;}
.rb-input{width:100%;padding:.85rem 1rem;border:1.5px solid #e7d9c5;border-radius:.875rem;font-size:.875rem;color:#0f172a;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;}
.rb-input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.12);}
.rb-label{display:block;font-size:.75rem;font-weight:800;color:#57534e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;}
.input-wrap{position:relative;}
.input-wrap .input-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:#a8a29e;font-size:.8rem;pointer-events:none;}
.input-wrap .rb-input.has-icon{padding-left:2.4rem;}
.input-wrap .input-end{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);color:#a8a29e;cursor:pointer;font-size:.875rem;}
.strength-bar{height:3px;border-radius:9999px;transition:width .3s,background .3s;}
</style>
</head>
<body class="hero-bg">

<nav class="fixed top-0 left-0 right-0 z-50 bg-[#fdf4e8]/85 backdrop-blur-sm border-b border-[#e7d9c5]">
  <div class="max-w-6xl mx-auto px-5 h-14 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2">
      <div class="bg-violet-600 text-white p-1.5 rounded-xl shadow-md shadow-violet-200"><i class="fa-solid fa-brain text-base"></i></div>
      <span class="text-base font-black text-slate-900">RelBrain<span class="text-violet-600">.ai</span></span>
    </a>
  </div>
</nav>

<main class="min-h-screen flex items-center justify-center px-4 pt-14 pb-10">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-xl border border-[#e7d9c5] overflow-hidden">
      <div class="p-7 md:p-9">
        <div class="text-center mb-7">
          <div class="w-16 h-16 bg-violet-50 border border-violet-100 rounded-2xl flex items-center justify-center mx-auto mb-4 float">
            <i class="fa-solid fa-lock text-violet-500 text-2xl"></i>
          </div>
          <h1 class="text-2xl font-black text-slate-900 mb-1">Nouveau mot de passe</h1>
          <p class="text-sm text-slate-500 font-semibold">Choisis un mot de passe fort et unique.</p>
        </div>

        <div class="mb-4">
          <label class="rb-label" for="pw1">Nouveau mot de passe</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="pw1" class="rb-input has-icon" placeholder="Minimum 8 caractères" style="padding-right:2.5rem" oninput="checkStrength()"/>
            <i class="fa-solid fa-eye input-end" id="toggle1" onclick="togglePw('pw1','toggle1')"></i>
          </div>
          <div class="flex gap-1 mt-2">
            <div class="strength-bar flex-1 bg-[#e7d9c5]" id="sb-1"></div>
            <div class="strength-bar flex-1 bg-[#e7d9c5]" id="sb-2"></div>
            <div class="strength-bar flex-1 bg-[#e7d9c5]" id="sb-3"></div>
            <div class="strength-bar flex-1 bg-[#e7d9c5]" id="sb-4"></div>
          </div>
          <p class="text-[11px] text-slate-400 mt-1 font-bold" id="strength-label"></p>
        </div>

        <div class="mb-6">
          <label class="rb-label" for="pw2">Confirmer le mot de passe</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="pw2" class="rb-input has-icon" placeholder="Même mot de passe" style="padding-right:2.5rem"/>
            <i class="fa-solid fa-eye input-end" id="toggle2" onclick="togglePw('pw2','toggle2')"></i>
          </div>
        </div>

        <button class="w-full gradient-bg text-white font-black py-3.5 rounded-xl shadow-lg shadow-violet-200 text-sm flex items-center justify-center gap-2 hover:-translate-y-0.5 transition-all" onclick="resetPassword()">
          <i class="fa-solid fa-check"></i> Réinitialiser le mot de passe
        </button>
      </div>
    </div>
  </div>
</main>

<script>
function togglePw(id, iconId){
  const inp = document.getElementById(id); const ico = document.getElementById(iconId);
  if (inp.type === 'password') { inp.type = 'text'; ico.className = 'fa-solid fa-eye-slash input-end'; }
  else { inp.type = 'password'; ico.className = 'fa-solid fa-eye input-end'; }
}
function checkStrength(){
  const pw = document.getElementById('pw1').value;
  const bars = [1,2,3,4].map(i=>document.getElementById('sb-'+i));
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^a-zA-Z0-9]/.test(pw)) score++;
  const colors = ['bg-rose-500','bg-orange-400','bg-amber-400','bg-emerald-500'];
  const texts = ['Très faible','Faible','Moyen','Fort 💪'];
  bars.forEach((b,i) => b.className = 'strength-bar flex-1 ' + (i < score && score > 0 ? colors[score-1] : 'bg-[#e7d9c5]'));
  document.getElementById('strength-label').textContent = pw ? texts[score-1] : '';
}
function resetPassword(){
  const pw1 = document.getElementById('pw1').value; const pw2 = document.getElementById('pw2').value;
  if (pw1.length < 8 || pw1 !== pw2) { alert('Vérifie ton mot de passe'); return; }
  window.location.href = 'relbrain-login.html';
}
</script>
</body>
</html>
