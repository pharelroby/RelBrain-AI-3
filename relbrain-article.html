<!DOCTYPE html>
<html lang="fr">
<head>
<script src="relbrain-loader.js"></script>
<meta charset="UTF-8"/>
<script>(function(){try{var p=localStorage.getItem('rb-theme')||'light';var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Article — Blog RelBrain</title>
<meta name="description" content="Article du blog RelBrain."/>
<meta name="theme-color" content="#7c3aed"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link rel="stylesheet" href="relbrain-design-system.css"/>
<script src="relbrain-theme.js" defer></script>
<script src="relbrain-motion.js" defer></script>
<script src="relbrain-sound.js" defer></script>
<script src="relbrain-config.js"></script>
<script src="relbrain-app.js" defer></script>
<script src="relbrain-site.js" defer></script>
<style>
.post-cover{aspect-ratio:16/9;border-radius:var(--rb-radius-md);background:linear-gradient(135deg,var(--from),var(--to));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.post-cover::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 23px,rgba(255,255,255,.12) 23px 24px)}
.post-cover::after{content:'';position:absolute;left:14%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35)}
.post-cover span{font-size:3.2rem;position:relative;filter:drop-shadow(0 8px 18px rgba(0,0,0,.2));transition:transform var(--rb-dur-slow) var(--rb-ease-spring)}
.post-card:hover .post-cover span{transform:scale(1.15) rotate(-6deg)}
.post-cover--big{aspect-ratio:21/9}.post-cover--big span{font-size:5rem}
.post-card{display:flex;flex-direction:column;text-decoration:none;padding:.75rem .75rem 1.25rem}
.post-card h3{font-family:var(--rb-font-display);font-weight:650;font-size:1.3rem;line-height:1.25;color:var(--rb-ink);margin:1rem .5rem .5rem}
.post-card p{font-size:.9rem;color:var(--rb-muted);font-weight:550;line-height:1.55;margin:0 .5rem}
.post-meta{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin:.9rem .5rem 0;font-size:.75rem;font-weight:700;color:var(--rb-faint)}
.featured{display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:center;padding:1rem;margin-bottom:2.5rem;text-decoration:none}
@media(max-width:860px){.featured{grid-template-columns:1fr}}
.featured h2{font-family:var(--rb-font-display);font-weight:650;font-size:clamp(1.6rem,1.2rem + 1.5vw,2.4rem);line-height:1.15;letter-spacing:-.02em;color:var(--rb-ink);margin:.75rem 0}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem}
.chips button{cursor:pointer}
.read-progress{position:fixed;top:0;left:0;height:3px;background:var(--rb-grad-ink);z-index:60;width:0;transition:width 80ms linear}
.article-head{max-width:46rem;margin:0 auto;text-align:center}
.article-body{max-width:46rem;margin:0 auto}
.share{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin-top:1.5rem}
</style>
</head>
<body class="rb-site">
<a href="#contenu" class="rb-sr-only">Aller au contenu</a>
<header data-rb-site-header></header>
<main id="contenu">
<div class="read-progress" id="progress" aria-hidden="true"></div>
<section class="rb-page-body" style="padding-top:clamp(2rem,1rem + 3vw,4rem)">
  <div class="rb-container">
    <div id="article"><div class="article-body"><div class="rb-skeleton rb-skeleton-line" style="height:2.5rem"></div><div class="rb-skeleton rb-skeleton-line"></div><div class="rb-skeleton rb-skeleton-line"></div><div class="rb-skeleton rb-skeleton-line"></div></div></div>
    <div id="related" style="margin-top:4rem"></div>
  </div>
</section>
</main>
<footer data-rb-site-footer></footer>
<script>
window.RBBlog = {
  load: function () { return fetch('content/blog/posts.json').then(function (r) { if (!r.ok) throw new Error('blog'); return r.json(); }); },
  inline: function (t) {
    return RB.escape(t)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(«])_(.+?)_(?=[\s.,;:!?)»]|$)/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\(((?:https?:\/\/|relbrain-|#)[^)\s]+)\)/g, '<a href="$2">$1</a>');
  },
  date: function (d) { return new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); },
  cover: function (p, big) {
    return '<div class="post-cover' + (big ? ' post-cover--big' : '') + '" style="--from:' + p.cover.from + ';--to:' + p.cover.to + '"><span>' + p.cover.glyph + '</span></div>';
  },
};

document.addEventListener('DOMContentLoaded', function () {
  var slug = new URLSearchParams(location.search).get('slug');
  var box = document.getElementById('article');
  function block(b) {
    var t = b.text ? RBBlog.inline(b.text) : '';
    switch (b.type) {
      case 'h2': return '<h2 id="' + b.text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '">' + t + '</h2>';
      case 'h3': return '<h3>' + t + '</h3>';
      case 'ul': case 'ol': return '<' + b.type + '>' + b.items.map(function (i) { return '<li>' + RBBlog.inline(i) + '</li>'; }).join('') + '</' + b.type + '>';
      case 'quote': return '<blockquote>' + t + '</blockquote>';
      case 'callout': return '<div class="rb-callout"><i class="fa-solid fa-lightbulb"></i><div>' + t + '</div></div>';
      case 'tip': return '<div class="rb-callout rb-callout--tip"><i class="fa-solid fa-circle-check"></i><div>' + t + '</div></div>';
      case 'warn': return '<div class="rb-callout rb-callout--warn"><i class="fa-solid fa-triangle-exclamation"></i><div>' + t + '</div></div>';
      default: return '<p>' + t + '</p>';
    }
  }
  RBBlog.load().then(function (d) {
    var p = d.posts.find(function (x) { return x.slug === slug; });
    if (!p) { box.innerHTML = '<div class="article-head"><h1 class="rb-h1">Article introuvable</h1><p class="rb-lead" style="margin-top:1rem">Il a peut-être été déplacé. <a href="relbrain-blog.html" style="color:var(--rb-violet)">Voir tous les articles</a></p></div>'; return; }
    var cats = {}; d.categories.forEach(function (c) { cats[c.id] = c.label; });
    document.title = p.title + ' — Blog RelBrain';
    var meta = document.querySelector('meta[name="description"]'); if (meta) meta.setAttribute('content', p.excerpt);
    var url = location.href;
    box.innerHTML =
      '<header class="article-head">' +
        '<a href="relbrain-blog.html" class="rb-caption" style="color:var(--rb-violet)"><i class="fa-solid fa-arrow-left"></i> Tous les articles</a>' +
        '<p style="margin-top:1.5rem"><span class="rb-tag">' + RB.escape(cats[p.category] || '') + '</span></p>' +
        '<h1 class="rb-h1" style="margin:1rem 0">' + RB.escape(p.title) + '</h1>' +
        '<p class="rb-lead">' + RB.escape(p.excerpt) + '</p>' +
        '<div class="rb-page-meta" style="justify-content:center"><span><i class="fa-solid fa-feather"></i>' + RB.escape(p.author.name) + '</span><span><i class="fa-solid fa-calendar"></i>' + RBBlog.date(p.date) + '</span><span><i class="fa-solid fa-clock"></i>' + p.reading_minutes + ' min de lecture</span></div>' +
      '</header>' +
      '<div style="max-width:56rem;margin:2.5rem auto">' + RBBlog.cover(p, true) + '</div>' +
      '<article class="article-body rb-prose">' + p.blocks.map(block).join('') + '</article>' +
      '<div class="article-body" style="margin-top:3rem;border-top:1px solid var(--rb-line);padding-top:1.5rem;text-align:center">' +
        '<p class="rb-caption">Cet article t\'a aidé·e ? Partage-le à ta promo.</p>' +
        '<div class="share">' +
          '<a class="rb-btn rb-btn--sm" style="--_bg:#16a34a" href="https://wa.me/?text=' + encodeURIComponent(p.title + ' — ' + url) + '" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>' +
          '<a class="rb-btn rb-btn--ghost rb-btn--sm" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url) + '" target="_blank" rel="noopener"><i class="fa-brands fa-facebook"></i> Facebook</a>' +
          '<button class="rb-btn rb-btn--ghost rb-btn--sm" id="copy-link"><i class="fa-solid fa-link"></i> Copier le lien</button>' +
        '</div>' +
        '<a class="rb-btn rb-btn--ink" href="relbrain-signup.html" style="margin-top:2rem">Essayer RelBrain gratuitement</a>' +
      '</div>';
    document.getElementById('copy-link').onclick = function () { navigator.clipboard.writeText(url).then(function () { RB.toast('Lien copié ✓', 'success'); }); };
    RB.motion.reveal(box);
    var others = d.posts.filter(function (x) { return x.slug !== slug; }).slice(0, 2);
    document.getElementById('related').innerHTML = '<p class="rb-eyebrow" style="margin-bottom:1rem">À lire ensuite</p><div class="rb-cards">' + others.map(function (o) {
      return '<a class="post-card rb-sheet rb-lift" href="relbrain-article.html?slug=' + o.slug + '">' + RBBlog.cover(o) + '<h3>' + RB.escape(o.title) + '</h3><p>' + RB.escape(o.excerpt) + '</p></a>';
    }).join('') + '</div>';
  }).catch(function () { box.innerHTML = '<p class="rb-caption">Impossible de charger l\'article.</p>'; });

  var bar = document.getElementById('progress');
  window.addEventListener('scroll', function () {
    var h = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + '%';
  }, { passive: true });
});
</script>
</body>
</html>
